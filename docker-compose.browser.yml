# Run on the VPS/VM where the social sessions should live. One worker/profile per workspace.
name: marketing-browser
services:
  browser-worker:
    build:
      context: .
      dockerfile: apps/browser-worker/Dockerfile
    restart: unless-stopped
    init: true
    env_file:
      - .env.browser
    ports:
      - "127.0.0.1:${BROWSER_LOCAL_PORT:-4090}:4090"
    shm_size: 1gb
    volumes:
      - browser-profile:/home/node/profile
    tmpfs:
      - /tmp:rw,size=2g,mode=1777
    security_opt:
      - no-new-privileges:true
    cap_drop:
      - ALL
    healthcheck:
      test: ["CMD", "node", "-e", "fetch('http://127.0.0.1:4090/health',{headers:{Authorization:'Bearer '+process.env.BROWSER_WORKER_TOKEN}}).then(r=>process.exit(r.ok?0:1)).catch(()=>process.exit(1))"]
      interval: 30s
      timeout: 5s
      start_period: 40s
volumes:
  browser-profile:
