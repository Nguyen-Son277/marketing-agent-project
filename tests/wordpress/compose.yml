services:
  db:
    image: mariadb:11
    environment:
      MARIADB_ROOT_PASSWORD: fixture-root
      MARIADB_DATABASE: wordpress
      MARIADB_USER: wordpress
      MARIADB_PASSWORD: fixture-password
    tmpfs:
      - /var/lib/mysql
    healthcheck:
      test: ['CMD', 'healthcheck.sh', '--connect', '--innodb_initialized']
      interval: 3s
      retries: 30
  wordpress:
    image: wordpress:6.8-php8.3-apache
    depends_on:
      db:
        condition: service_healthy
    ports: ['127.0.0.1:8097:80']
    environment:
      WORDPRESS_DB_HOST: db
      WORDPRESS_DB_USER: wordpress
      WORDPRESS_DB_PASSWORD: fixture-password
      WORDPRESS_DB_NAME: wordpress
      WORDPRESS_CONFIG_EXTRA: "define('WP_ENVIRONMENT_TYPE', 'local');"
    volumes:
      - wp:/var/www/html
      - ../../plugins/marketing-agent-wordpress:/var/www/html/wp-content/plugins/marketing-agent-wordpress:ro
  cli:
    image: wordpress:cli-php8.3
    user: '33:33'
    depends_on: [wordpress]
    environment:
      WORDPRESS_DB_HOST: db
      WORDPRESS_DB_USER: wordpress
      WORDPRESS_DB_PASSWORD: fixture-password
      WORDPRESS_DB_NAME: wordpress
    volumes:
      - wp:/var/www/html
      - ../../plugins/marketing-agent-wordpress:/var/www/html/wp-content/plugins/marketing-agent-wordpress:ro
volumes:
  wp:
