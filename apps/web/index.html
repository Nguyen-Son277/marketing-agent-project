<!doctype html>
<html lang="vi">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <meta name="color-scheme" content="light dark" />
    <meta name="theme-color" content="#1b5e4a" />
    <link rel="icon" href="/favicon.ico" sizes="16x16 32x32 48x48" />
    <link rel="icon" type="image/svg+xml" href="/brand/logo.svg" sizes="any" />
    <link rel="apple-touch-icon" href="/apple-touch-icon.png" sizes="180x180" />
    <title>Đội Agent Marketing</title>
    <meta
      name="description"
      content="Hệ thống đội agent marketing: Leader điều phối, chuyên môn thực thi, kho kiến thức riêng cho từng công ty."
    />
    <!--
      Đặt theme TRƯỚC khi CSS/React tải: nếu để provider React làm việc này, người dùng
      chọn chế độ tối sẽ thấy một nháy nền sáng mỗi lần tải trang.

      Vì sao viết thẳng ở đây thay vì import module: script trong head phải chạy đồng bộ
      trước lần vẽ đầu tiên, mà import module là bất đồng bộ. Khoá lưu và quy tắc dự phòng
      phải trùng `src/lib/theme-store.ts`; đổi một nơi là phải đổi cả hai.
    -->
    <script>
      (function () {
        var KEY = 'ma.theme'
        var theme = 'light'
        try {
          var stored = window.localStorage.getItem(KEY)
          if (stored === 'light' || stored === 'dark') theme = stored
          else if (window.matchMedia && window.matchMedia('(prefers-color-scheme: dark)').matches) theme = 'dark'
        } catch (error) {
          // Chặn localStorage: vẫn phải chạy, chỉ là không nhớ được lựa chọn.
        }
        document.documentElement.setAttribute('data-theme', theme)
        document.documentElement.style.colorScheme = theme
      })()
    </script>
    <style>
      /* Nền tối thiểu trước khi bundle CSS tới, để không nháy trắng ở chế độ tối. */
      html[data-theme='dark'] body { background: #12181a; }
      html[data-theme='light'] body { background: #faf9f6; }
    </style>
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
